<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login | Grill Out</title>
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" />
<link rel="stylesheet" href="shared/admin.css" />
</head>
<body class="flex min-h-screen items-center justify-center bg-charcoal px-4 text-white">

  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center gap-2 text-center">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-10 w-10 text-flame">
        <path d="M12.5 1.5c1 3-2 4.5-2 7.5a2.5 2.5 0 0 0 5 0c0-.6-.2-1.1-.5-1.6 2 1 3.5 3 3.5 5.6a6.5 6.5 0 1 1-13 0c0-4 2.5-6 4-8.5.7-1.1 1.3-2.1 3-3z"/>
      </svg>
      <h1 class="font-display text-3xl tracking-wider">GRILL <span class="text-flame">OUT</span></h1>
      <p class="text-sm text-gray-500">Admin Dashboard</p>
    </div>

    <form id="login-form" class="rounded-2xl border border-white/10 bg-charcoal2 p-6 sm:p-8" novalidate>
      <div id="form-error" class="mb-4 hidden rounded-xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-400" role="alert"></div>

      <label for="email" class="mb-1.5 block text-sm font-medium text-gray-300">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required
        class="mb-4 w-full rounded-xl border border-white/10 bg-charcoal px-4 py-2.5 text-sm text-white placeholder-gray-600 outline-none transition focus:border-flame focus:ring-1 focus:ring-flame"
        placeholder="Email address" />

      <label for="password" class="mb-1.5 block text-sm font-medium text-gray-300">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
        class="mb-6 w-full rounded-xl border border-white/10 bg-charcoal px-4 py-2.5 text-sm text-white placeholder-gray-600 outline-none transition focus:border-flame focus:ring-1 focus:ring-flame"
        placeholder="••••••••" />

      <button id="submit-btn" type="submit"
        class="flex w-full items-center justify-center gap-2 rounded-full bg-flame py-3 text-sm font-semibold text-white transition hover:bg-flame-light disabled:cursor-not-allowed disabled:opacity-60">
        <span id="submit-label">Log In</span>
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-gray-600">Restricted area. Authorized personnel only.</p>
  </div>

<script src="pages/login.js"></script>
</body>
</html>
